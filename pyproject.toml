[tool.poetry]
name = "scphytr"
version = "0.0.0"
description = "Phylogenetic comparative methods for single-cell gene expression data."
license = "MIT"
authors = ["pedrofale <pedro.miguel.ferreira.pf@gmail.com>"]
readme = "README.md"
repository = "https://github.com/pedrofale/scphytr"
packages = [{include = "scphytr", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
numpy = "*"
scipy = "*"
pandas = "*"
jax = "*"
optax = "*"
blackjax = "<1.5"
# scBEM is a Stan model (decision-scbem-stan-engine): cmdstanpy drives it, arviz
# handles the posterior objects. NOTE cmdstanpy is only the Python driver -- CmdStan
# itself is a C++ toolchain installed separately, once, with:
#     python -c "import cmdstanpy; cmdstanpy.install_cmdstan()"
cmdstanpy = "*"
arviz = "*"

